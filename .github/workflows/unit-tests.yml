name: unit-tests
# Sources
#  - https://github.com/MDU-PHL/hicap/blob/master/.github/workflows/hicap-test.yml
#  - https://himal2007.github.io/blog/2025/github-actions-workflow/
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repository
      - name: Checkout current code
        uses: actions/checkout@v4

      # Step 2: Set up Conda with Mamba (Using Miniforge3)
      - name: Set up Conda with Mamba
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          use-mamba: true
          activate-environment: test

      # Step 3: Create Conda environment & install beast_pype
      - name: Create Conda environment
        shell: bash -el {0}
        run: |
          mamba create --name beast_pype
          source $CONDA/bin/activate beast_pype
          mamba install bioconda::beast2
          pip install .

      # Step 4:
      - name: Install extra dependancies
        shell: bash -el {0}
        run: |
          source $CONDA/bin/activate beast_pype
          python -m ipykernel install --user --name=beast_pype
          python -m bash_kernel.install --user
          packagemanager -add BDSKY
          packagemanager -add BEASTLabs


      # Step 5:
      - name: Run tests
        shell: bash -el {0}
        run: |
          source $CONDA/bin/activate beast_pype
          pytest -n logical tests/