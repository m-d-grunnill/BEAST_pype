collection_date_field: 'sampleCollectionDate' #    Name of field in metadata_db containing collection dates of sequences. Should be formatted YYYY-MM-DD.
fasta_path: example_data/Measles/Netherlands_2024_measles_D8_sequences.fasta #    Path to fasta file containing sequences to be placed into template xml.
initial_tree_type: Temporal #    Intial tree type to use. str (either 'Distance' or 'Temporal') or None
downsample_to: 35 #    If provided the fasta file and initial tree file used to generate the BEAST 2 xml is downsampled to this amount.
log_file_basename: BEAST #     If provided .tree, .log and .state files from running BEAST 2 will have this name prefixed by 'run-with-seed-{seed}-'.
metadata_path: example_data/Measles/Netherlands_2024_measles_D8_metadata.csv #      Path to csv or tsv containing metadata for sequences in fasta_path.
overall_save_dir: Sbatch_Example-Generic_full #    Path to where you are saving all the runs of this workflow.
sample_id_field: 'accessionVersion' #    Name of field in metadata_db containing sequence IDs.
template_xml_path: template_beast_xmls/Measles/Measles_coalescent_exp.xml #    Path to template BEAST 2 xml.
chain_length: 10000000 # Number of chains to use for BEAST runs.
screen_log_every: 0.001 #    How often to output to screen during BEAST runs.
store_state_every: 0.0001 #    How often to store MCMC state during BEAST runs.
trace_log_every: 0.0001 #    How often to save a log file during BEAST runs.
tree_log_every: 0.0001 #    How often to save a tree file during BEAST runs.

#Running BEAST 2
number_of_beast_runs: 9 # Number of chains to use (repeated runs to do) when running BEAST.
seed_to_rule_them_all: 42 #    If provided, this seed is used for all BEAST runs. Otherwise, a random seed is generated for each run.

sbatch_options_needing_a_value:
    '--cpus-per-task': 1             # Number of CPU cores per task
    '--time': 3-00:00:00 # Maximum runtime (D-HH:MM:SS)
    '--mem': 4G      # RAM to use.
#    '--partition':  # If needed uncomment and fill in the name of a partition to use.
#    '-A': # If needed uncomment and fill in the account to use.