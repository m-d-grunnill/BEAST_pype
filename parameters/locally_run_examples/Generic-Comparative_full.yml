collection_date_field: 'sampleCollectionDate' #    Name of field in metadata_db containing collection dates of sequences. Should be formatted YYYY-MM-DD.
fasta_path: example_data/Measles/Netherlands_2024_measles_sequences.fasta # Path to fasta file containing sequences to be placed into template xml.
metadata_path: example_data/Measles/Netherlands_2024_measles_metadata.csv # Path to csv or tsv containing metadata for sequences in fasta_path.
downsample_to: 35 #    If provided the fasta file and initial tree file used to generate the BEAST 2 xml is downsampled to this amount.
number_of_beast_runs: 9 #Number of chains to use (repeated runs to do) when running BEAST.
seed_to_rule_them_all: 42 #    If provided, this seed is used for all BEAST runs. Otherwise, a random seed is generated for each run.
overall_save_dir: Local_Example-Generic-Comparative_full #    Path to where you are saving all the runs of this workflow.
log_file_basename: BEAST # The definitions for the xml_sets you wish to use.
sample_id_field: 'accessionVersion' #    Name of field in metadata_db containing sequence IDs.
template_xml_path: template_beast_xmls/Measles/Measles_coalescent_exp.xml #    Path to template BEAST 2 xml.

chain_length: 5000000 # Number of chains to use for BEAST runs.
screen_log_every: 10000 #    How often to output to screen during BEAST runs.
store_state_every: 1000 #    How often to store MCMC state during BEAST runs.
trace_log_every: 1000 #    How often to save a log file during BEAST runs.
tree_log_every: 1000 #    How often to save a tree file during BEAST runs.

# Defining XML Sets (Partitioning Data)
xml_set_definitions: # The definitions for the xml_sets you wish to use.
  #{Keys=The name used for the xml_set.: Values: Will be used with pandas DataFrame.query to separate out your data}
 D8: "`genotype` == 'D8'"
 B3: "`genotype` == 'B3'"

