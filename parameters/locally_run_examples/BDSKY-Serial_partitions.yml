collection_date_field: 'sampleCollectionDate' #    Name of field in metadata_db containing collection dates of sequences. Should be formatted YYYY-MM-DD.
fasta_path: example_data/Measles/Netherlands_2024_measles_D8_sequences.fasta #    Path to fasta file containing sequences to be placed into template xml.
use_initial_tree: True
log_file_basename: BDSKY_serial #    If provided .tree, .log and .state files from running BEAST 2 will have this name prefixed by 'run-with-seed-{seed}-'.
metadata_path: example_data/Measles/Netherlands_2024_measles_D8_metadata.csv #    Path to csv or tsv containing metadata for sequences in fasta_path.
overall_save_dir: Local_Example-BDSKY_change_times #    Path to where you are saving all the runs of this workflow.
rt_partitions: #Instructions for setting rt_change date, going backwards from youngest xml_set in fasta_path until rt_partitions["end"]  is reached.
  # {'unit': 'days, weeks or years', 'every': int/float, 'end': date str YYYY-MM-DD}
  unit: months
  every: 3
sampling_prop_partitions:     #Instructions for setting sampling_prop_change date, going backwards from the youngest collection date in metadata until sampling_prop_partition_freq["end"]  is reached.
    #If sampling_prop_partition_freq["end"] is not given the oldest collection date in metadata is used for this end point value instead.
  unit: months
  every: 3
origin_start_addition: 0.049315068493150684 #    Suggested infection period of pathogen. **Should be in years.** This + initial MLE tree height is used as starting value of origin.
origin_upper_addition: 5 #    This + initial MLE tree height is used as upper value of origin prior.
zero_sampling_before_first_sample: True # Fix the sampling proportion to 0 for the period before the first xml_set.
sample_id_field: 'accessionVersion' #    Name of field in metadata_db containing sequence IDs.
template_xml_path: template_beast_xmls/Measles/Measles_BDKSY-Serial.xml #    Path to template BEAST 2 xml.
chain_length: 5e6 # Number of chains to use for BEAST runs.
screen_log_every: 1e4 #    How often to output to screen during BEAST runs.
store_state_every: 1e3 #    How often to store MCMC state during BEAST runs.
trace_log_every: 1e3 #    How often to save a log file during BEAST runs.
tree_log_every: 1e3 #    How often to save a tree file during BEAST runs.

#Running BEAST 2
number_of_beast_runs: 9 #Number of chains to use (repeated runs to do) when running BEAST.
seed_to_rule_them_all: 42 #    If provided, this seed is used for all BEAST runs. Otherwise, a random seed is generated for each run.
