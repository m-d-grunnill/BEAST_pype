collection_date_field: 'sampleCollectionDate' #    Name of field in metadata_db containing collection dates of sequences. Should be formatted YYYY-MM-DD.
fasta_path: example_data/Measles/european_measles.fasta #    Path to fasta file containing sequences to be placed into template xml.
use_initial_tree: False
log_file_basename: BDSKY_serial #    If provided .tree, .log and .state files from running BEAST 2 will have this name prefixed by 'run-with-seed-{seed}-'.
metadata_path: example_data/Measles/european_measles_metadata.tsv #    Path to csv or tsv containing metadata for sequences in fasta_path.
overall_save_dir: Local-Test-BDSKY_change_times #    Path to where you are saving all the runs of this workflow.
rt_partitions: #Instructions for setting rt_change date, going backwards from youngest xml_set in fasta_path until rt_partitions["end"]  is reached.
  # {'unit': 'days, weeks or years', 'every': int/float, 'end': date str YYYY-MM-DD}
  unit: months
  every: 6
sampling_prop_partitions:     #Instructions for setting sampling_prop_change date, going backwards from the youngest collection date in metadata until sampling_prop_partition_freq["end"]  is reached.
    #If sampling_prop_partition_freq["end"] is not given the oldest collection date in metadata is used for this end point value instead.
  unit: months
  every: 6
zero_sampling_before_first_sample: True # Fix the sampling proportion to 0 for the period before the first xml_set.
sample_id_field: 'accessionVersion' #    Name of field in metadata_db containing sequence IDs.
template_xml_path: template_beast_xmls/Measles/Measles_BDKSY-Serial.xml #    Path to template BEAST 2 xml.
chain_length: 50000 # Number of chains to use for BEAST runs.
screen_log_every: 5000 #    How often to output to screen during BEAST runs.
store_state_every: 1000 #    How often to store MCMC state during BEAST runs.
trace_log_every: 1000 #    How often to save a log file during BEAST runs.
tree_log_every: 1000 #    How often to save a tree file during BEAST runs.

#Running BEAST 2
number_of_beast_runs: 3 #Number of chains to use (repeated runs to do) when running BEAST.
iqtree_seed: 42
treetime_seed: 42
downsampled_iqtree_seed: 42
downsampled_treetime_seed: 42
beast_seeds:
  - 1
  - 12
  - 123
#  - 1234
#  - 12345
#  - 123456