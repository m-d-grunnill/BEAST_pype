# Example Parameters for running the BDSKY-Serial-Comparative.ipynb workflow.

# Running an Instance of this Workflow
overall_save_dir: Local-Test-BDSKY-Serial-Comparative_no_downsampling # Path to where you are saving all the runs of this workflow.

# General Inputs
template_xml_path: template_beast_xmls/Measles/Measles_BDKSY-Serial.xml #    Path to template BEAST 2 xml. #Path to template BEAST 2 xml.
fasta_path: example_data/Measles/all_measles.fasta # Path to fasta file containing sequences to be placed into template xml.
metadata_path: example_data/Measles/all_measles_metadata.tsv # Path to csv or tsv containing metadata for sequences in fasta_path.
sample_id_field: 'accessionVersion' #    Name of field in metadata_db containing sequence IDs.
collection_date_field: 'sampleCollectionDate' #Name of field in metadata_db containing collection dates of sequences. Should be formatted YYYY-MM-DD.

# Defining XML Sets (Partitioning Data)
# Defining XML Sets (Partitioning Data)
xml_set_definitions: # The definitions for the xml_sets you wish to use.
  #{Keys=The name used for the xml_set.: Values: Will be used with pandas DataFrame.query to separate out your data}
 Netherlands: "`geoLocCountry` == 'Netherlands'"
 Austria: "geoLocCountry == 'Austria'"

# Initial Tree Building & Downsampling
use_initial_tree: true

# BDSky Options
rt_dims: 3 #    Number of Rt dimensions (time periods over which Rt is estimated).
zero_sampling_before_first_sample: True # Fix the sampling proportion to 0 for the period before the first xml_set.


#MCMC Tree/Logfile names Chain-lengths & Save Steps
log_file_basename: BDSKY_Serial # If provided .tree, .log and .state files from running BEAST 2 will have this name prefixed by 'run-with-seed-{seed}-', number being that of the chain.
chain_length: 10000000 # Number of chains to use for BEAST runs.
screen_log_every: 0.001 #    How often to output to screen during BEAST runs.
store_state_every: 0.0001 #    How often to store MCMC state during BEAST runs.
trace_log_every: 0.0001 #    How often to save a log file during BEAST runs.
tree_log_every: 0.0001 #    How often to save a tree file during BEAST runs.

#Running BEAST 2
number_of_beast_runs: 9 #Number of chains to use (repeated runs to do) when running BEAST.
seed_to_rule_them_all: 42 #    If provided, this seed is used for all BEAST runs. Otherwise, a random seed is generated for each run.

